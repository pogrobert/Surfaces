<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<meta name="theme-color" content="#fbfbfa" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0b0b0a" media="(prefers-color-scheme: dark)">
<!-- The theme a reader chose, set before the first paint so the page never flashes the other one. -->
<script>try{var t=localStorage.getItem("surfaces-theme");if(t==="light"||t==="dark")document.documentElement.dataset.theme=t}catch(e){}</script>
<title>Surfaces</title>
<meta name="description" content="Covers, link previews and headers for every page of a site, drawn by code from one brand colour. No AI and no API key: the same title always gives the same picture.">
<!-- The icon: three sheets, each turned a little more than the one in front. One graphite tile for both themes. -->
<link rel="icon" href="/favicon.ico" sizes="32x32">
<link rel="icon" type="image/svg+xml" href="/icon.svg">
<link rel="icon" type="image/png" href="/icon-192.png" sizes="192x192">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<link rel="canonical" href="https://surfaces.pogrobert.com/">
<!-- The card a shared link shows on X, LinkedIn, Slack and iMessage. Its picture is drawn by Surfaces: pnpm previews. -->
<meta property="og:type" content="website">
<meta property="og:site_name" content="Surfaces">
<meta property="og:url" content="https://surfaces.pogrobert.com/">
<meta property="og:title" content="Surfaces: pictures for every page of your site">
<meta property="og:description" content="Covers, link previews and headers for every page of a site, drawn by code from one brand colour. No AI and no API key: the same title always gives the same picture.">
<meta property="og:image" content="https://surfaces.pogrobert.com/og.jpg">
<meta property="og:image:type" content="image/jpeg">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta property="og:image:alt" content="Abstract cover art for &quot;Pictures for every page of your site, drawn from one colour.&quot;: two overlapping grey circles.">
<meta name="twitter:card" content="summary_large_image">
</head>
<body>
<div id="root"></div>
<noscript>
  <main style="max-width:60ch;margin:15vh auto;padding:0 24px;font:17px/1.5 system-ui,sans-serif">
    <h1>Surfaces</h1>
    <p>Pictures for every page of your site, drawn from one colour: the cover of each post, the preview of each link, the header of each profile. The words stay yours, in your own type. No image model, no API key, nothing to pay.</p>
    <p>The pictures on this page are drawn as you watch, which needs JavaScript. To add Surfaces to a site, run <code>npx @pogrobert/surfaces init</code>.</p>
    <p><a href="https://github.com/pogrobert/surfaces">GitHub</a> · <a href="https://www.npmjs.com/package/@pogrobert/surfaces">npm</a></p>
  </main>
</noscript>
<script type="module" src="/src/home.tsx"></script>
</body>
</html>
