<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Surfaces contact sheet</title>
<style>
  :root { --page:#f4f4f2; --panel:#fff; --line:#e2e2de; --fg:#17171a; --muted:#6c6c74; --bad:#c2281d; --good:#14764a; }
  @media (prefers-color-scheme: dark) {
    :root { --page:#0c0c0e; --panel:#151518; --line:#28282d; --fg:#f2f2f0; --muted:#9a9aa3; --bad:#ff7a6e; --good:#4fd39a; }
  }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--page); color:var(--fg); font:13px/1.45 ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif; }
  header { position:sticky; top:0; z-index:5; display:flex; flex-wrap:wrap; gap:8px 18px; align-items:center; padding:10px 16px; background:var(--panel); border-bottom:1px solid var(--line); }
  header h1 { font-size:14px; margin:0; font-weight:600; }
  .group { display:flex; gap:2px; align-items:center; }
  .group span { color:var(--muted); margin-right:6px; }
  button { font:inherit; color:var(--fg); background:none; border:0; padding:4px 9px; border-radius:6px; cursor:pointer; }
  button:hover { background:var(--line); }
  button[aria-pressed="true"] { background:var(--fg); color:var(--panel); }
  #status { margin-left:auto; color:var(--muted); }
  #status b { font-weight:600; color:var(--good); }
  #status b.bad { color:var(--bad); }
  main { display:grid; grid-template-columns:repeat(auto-fill, minmax(min(100%, 520px), 1fr)); gap:18px 14px; padding:14px 16px 60px; align-items:start; }
  .pair { display:grid; grid-template-columns:1fr 1fr; gap:4px; content-visibility:auto; contain-intrinsic-size:auto 170px; align-items:start; align-content:start; }
  .pair.one { grid-template-columns:1fr; }
  .pair figcaption { grid-column:1 / -1; color:var(--muted); font-size:11px; display:flex; gap:8px; align-items:center; }
  .pair figcaption i { width:9px; height:9px; border-radius:3px; display:inline-block; }
  figure { margin:0; }
  .tile { position:relative; overflow:hidden; border-radius:7px; container-type:inline-size; display:block; padding:0; width:100%; background:#8884; }
  .tile img { position:absolute; inset:0; width:100%; height:100%; display:block; }
  .tile .text { position:absolute; display:flex; flex-direction:column; justify-content:flex-end; text-align:left; gap:.5em; font-weight:600; letter-spacing:-.012em; line-height:1.14; text-wrap:balance; pointer-events:none; }
  .tile small { font-size:.62em; font-weight:500; letter-spacing:0; opacity:.72; }
  .tile.flag { outline:2px solid var(--bad); outline-offset:1px; }
  dialog { border:0; padding:0; background:none; max-width:min(1200px, 94vw); }
  dialog::backdrop { background:#000c; }
  dialog .tile { width:min(1200px, 94vw); }
  dialog p { color:#fff; margin:8px 0 0; font-size:12px; }
</style>
</head>
<body>
<header>
  <h1>Surfaces</h1>
  <div class="group" id="styles"><span>Style</span></div>
  <div class="group" id="themes"><span>Theme</span></div>
  <div class="group" id="uses"><span>Use</span></div>
  <div class="group" id="grains"><span>Grain</span></div>
  <div class="group" id="order"><span>Order</span></div>
  <button id="measure" hidden>Measure pixels</button>
  <div id="status">Loading…</div>
</header>
<main id="grid"></main>
<dialog id="zoom"><div id="zoomBody"></div></dialog>

<script type="module">
const { styles, uses, tiles } = await (await fetch("manifest.json")).json()
const params = new URLSearchParams(location.search)
const state = { style: params.get("style") ?? "all", theme: params.get("theme") ?? "both", use: params.get("use") ?? "all", grain: params.get("grain") ?? "all", order: "seed" }

const grid = document.querySelector("#grid")
const seedKey = (tile) => tile.file.replace(/-(light|dark)\.svg$/, "")
const pairs = new Map()
for (const tile of tiles) {
  const key = seedKey(tile)
  pairs.set(key, { key, ...pairs.get(key), [tile.input.theme]: tile, input: tile.input, layout: tile.layout })
}

function tileNode(tile, tag = "button") {
  const node = document.createElement(tag)
  node.className = "tile"
  node.style.aspectRatio = `${tile.w} / ${tile.h}`
  const { x, y, w, h } = tile.safe ?? { x: 0, y: 0, w: 0, h: 0 }
  // As large as a real cover would set it: fills the safe box's height in two
  // lines, unless the box's width runs out first.
  const size = Math.min((h / tile.w) * 22, (w / tile.w) * 10)
  node.innerHTML = `<img loading="lazy" decoding="async" alt="" src="svg/${tile.file}">
    <div class="text" ${tile.safe ? "" : "hidden"} style="left:${(x / tile.w) * 100}%;top:${(y / tile.h) * 100}%;width:${(w / tile.w) * 100}%;height:${(h / tile.h) * 100}%;color:${tile.ink};font-size:${size}cqw">
      <small>Oct 31, 2026</small><span>${tile.title}</span></div>`
  if (tile.quality?.flag) node.classList.add("flag")
  node.addEventListener("click", () => {
    const body = document.querySelector("#zoomBody")
    body.replaceChildren(tileNode(tile, "div"))
    const note = document.createElement("p")
    note.textContent = `${JSON.stringify(tile.input)}${tile.quality ? ` · worst contrast ${tile.quality.contrast.toFixed(2)}:1` : ""}`
    body.append(note)
    document.querySelector("#zoom").showModal()
  })
  return node
}
document.querySelector("#zoom").addEventListener("click", (event) => event.currentTarget.close())

function render() {
  const shown = [...pairs.values()].filter((pair) =>
    (state.style === "all" || pair.input.style === state.style) &&
    (state.use === "all" || pair.layout === state.use) &&
    (state.grain === "all" || (pair.input.grain ?? "natural") === state.grain))
  if (state.order === "worst") {
    const score = (pair) => Math.min(pair.light?.quality?.contrast ?? 99, pair.dark?.quality?.contrast ?? 99)
    shown.sort((a, b) => score(a) - score(b))
  }
  const fragment = document.createDocumentFragment()
  for (const pair of shown) {
    const figure = document.createElement("figure")
    figure.className = `pair ${state.theme === "both" ? "" : "one"}`
    for (const theme of ["light", "dark"]) {
      if (state.theme === "both" || state.theme === theme) figure.append(tileNode(pair[theme]))
    }
    const caption = document.createElement("figcaption")
    const { style, use, mood, grain, detail, color, seed, width, height, text } = pair.input
    const shape = pair[state.theme === "dark" ? "dark" : "light"].shape
    caption.innerHTML = `<i style="background:${color}"></i>${[style, shape, use ?? `${width}×${height}`, text, mood, grain && `${grain} grain`, detail, seed].filter(Boolean).join(" · ")}`
    figure.append(caption)
    fragment.append(figure)
  }
  grid.replaceChildren(fragment)
}

function buttons(host, name, options) {
  for (const option of options) {
    const button = document.createElement("button")
    button.textContent = option
    const sync = () => host.querySelectorAll("button").forEach((item) =>
      item.setAttribute("aria-pressed", String(item.textContent === state[name])))
    button.addEventListener("click", () => { state[name] = option; sync(); render() })
    host.append(button)
    sync()
  }
}
buttons(document.querySelector("#styles"), "style", ["all", ...styles])
buttons(document.querySelector("#themes"), "theme", ["both", "light", "dark"])
buttons(document.querySelector("#uses"), "use", ["all", ...uses])
buttons(document.querySelector("#grains"), "grain", ["all", "smooth", "natural", "heavy"])
buttons(document.querySelector("#order"), "order", ["seed", "worst"])
render()

// The two promises a browser can check and Node can't: that this engine
// computes the same bytes as the server did, and that real pixels leave a
// title readable.
const status = document.querySelector("#status")
const { generate, toSvg } = await import("/dist/index.js")

const sha = async (text) => [...new Uint8Array(await crypto.subtle.digest("SHA-256", new TextEncoder().encode(text)))]
  .map((byte) => byte.toString(16).padStart(2, "0")).join("")

let mismatches = 0
let checked = 0
for (const tile of tiles) {
  if ((await sha(toSvg(generate(tile.input)))) !== tile.sha) mismatches++
  if (++checked % 20 === 0) {
    status.textContent = `Checking bytes… ${checked} of ${tiles.length}`
    await new Promise((resolve) => setTimeout(resolve))
  }
}
status.innerHTML = mismatches
  ? `<b class="bad">${mismatches} of ${tiles.length} differ from Node</b>`
  : `<b>${tiles.length} tiles byte-identical to Node</b>`

const luminance = (r, g, b) => {
  const channel = (value) => {
    const c = value / 255
    return c <= 0.04045 ? c / 12.92 : ((c + 0.055) / 1.055) ** 2.4
  }
  return 0.2126 * channel(r) + 0.7152 * channel(g) + 0.0722 * channel(b)
}
const hexLuminance = (hex) => luminance(parseInt(hex.slice(1, 3), 16), parseInt(hex.slice(3, 5), 16), parseInt(hex.slice(5, 7), 16))

async function measure(tile, canvas, context) {
  if (!tile.safe) {
    tile.quality = { contrast: 99, flag: false }
    return
  }
  const image = new Image()
  image.src = `svg/${tile.file}`
  await image.decode()
  const width = 480
  const height = Math.round((width * tile.h) / tile.w)
  canvas.width = width
  canvas.height = height
  context.drawImage(image, 0, 0, width, height)
  const scale = width / tile.w
  const x = Math.round(tile.safe.x * scale)
  const y = Math.round(tile.safe.y * scale)
  const w = Math.round(tile.safe.w * scale)
  const h = Math.round(tile.safe.h * scale)
  const { data } = context.getImageData(x, y, w, h)
  const ink = hexLuminance(tile.ink)
  // Averaged over an 8px block, about one letter at this scale, so a lone
  // speck of grain doesn't count against the title the way a shape would.
  let worst = Infinity
  for (let by = 0; by + 8 <= h; by += 4) {
    for (let bx = 0; bx + 8 <= w; bx += 4) {
      let sum = 0
      for (let py = by; py < by + 8; py++) {
        for (let px = bx; px < bx + 8; px++) {
          const i = (py * w + px) * 4
          sum += luminance(data[i], data[i + 1], data[i + 2])
        }
      }
      const under = sum / 64
      const ratio = (Math.max(under, ink) + 0.05) / (Math.min(under, ink) + 0.05)
      worst = Math.min(worst, ratio)
    }
  }
  tile.quality = { contrast: worst, flag: worst < 4.5 }
}

window.runQuality = async () => {
  const canvas = document.createElement("canvas")
  const context = canvas.getContext("2d", { willReadFrequently: true })
  let done = 0
  for (const tile of tiles) {
    await measure(tile, canvas, context)
    done++
    // Back to the event loop every few tiles, so the page stays usable while
    // this runs.
    if (done % 8 === 0) await new Promise((resolve) => setTimeout(resolve))
    if (done % 100 === 0) status.textContent = `Measuring pixels… ${done} of ${tiles.length}`
  }
  const flagged = tiles.filter((tile) => tile.quality.flag)
  const worst = [...tiles].sort((a, b) => a.quality.contrast - b.quality.contrast)
  status.innerHTML = `<b>${mismatches ? `${mismatches} differ` : `${tiles.length} byte-identical to Node`}</b> · <b class="${flagged.length ? "bad" : ""}">${flagged.length} under 4.5:1</b> · worst ${worst[0].quality.contrast.toFixed(2)}:1`
  // Only a flagged tile changes what's drawn; rebuilding 4,000 tiles is not free.
  if (flagged.length) render()
  return { mismatches, measured: tiles.length, flagged: flagged.length, worst: worst.slice(0, 30).map((tile) => ({ contrast: +tile.quality.contrast.toFixed(2), ...tile.input })) }
}
window.mismatches = mismatches
const measureButton = document.querySelector("#measure")
measureButton.hidden = false
measureButton.addEventListener("click", () => {
  measureButton.hidden = true
  window.runQuality()
})
</script>
</body>
</html>
