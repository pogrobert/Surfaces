<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Surfaces</title>
<style>
  :root {
    --page:#f5f4f1; --panel:#ffffff; --sunk:#efeee9; --line:#e3e1db; --fg:#17171a; --muted:#6b6b72; --accent:#17171a; --on-accent:#fff;
    --bad:#b42318; --bad-bg:#fdecea; --warn:#8a5a00; --warn-bg:#fdf3dd; --radius:12px;
    color-scheme: light;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --page:#0d0d0f; --panel:#151518; --sunk:#1c1c20; --line:#2a2a30; --fg:#f2f1ee; --muted:#9b9ba4; --accent:#f2f1ee; --on-accent:#111;
      --bad:#ff8a7e; --bad-bg:#3a1512; --warn:#f2c14e; --warn-bg:#33270c; color-scheme: dark;
    }
  }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--page); color:var(--fg); font:14px/1.5 ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif; }
  a { color:inherit; }
  button, input, select, textarea { font:inherit; color:inherit; }
  .wrap { max-width:1380px; margin:0 auto; padding:0 20px; }

  header.top { display:flex; align-items:baseline; gap:14px; padding:22px 0 6px; }
  header.top h1 { margin:0; font-size:20px; letter-spacing:-.01em; }
  header.top p { margin:0; color:var(--muted); }
  header.top a { margin-left:auto; color:var(--muted); font-size:13px; }

  h2 { font-size:13px; text-transform:uppercase; letter-spacing:.06em; color:var(--muted); margin:28px 0 12px; font-weight:600; }
  h2 b { color:var(--fg); }

  /* 1. Styles */
  .styles { display:grid; grid-template-columns:repeat(auto-fill, minmax(190px, 1fr)); gap:12px; }
  .style { text-align:left; padding:0; border:1px solid var(--line); background:var(--panel); border-radius:var(--radius); overflow:hidden; cursor:pointer; display:flex; flex-direction:column; }
  .style:hover { border-color:var(--muted); }
  .style[aria-pressed="true"] { outline:2px solid var(--accent); outline-offset:1px; border-color:transparent; }
  .style .thumb { aspect-ratio:16/9; position:relative; overflow:hidden; background:var(--sunk); }
  .style .thumb > svg { position:absolute; inset:0; width:100%; height:100%; }
  .style .meta { padding:8px 10px 10px; }
  .style .name { font-weight:600; text-transform:capitalize; }
  .style .looks { color:var(--muted); font-size:12px; line-height:1.35; margin-top:2px; display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden; }

  /* 2. Tune */
  .tune { display:grid; grid-template-columns:minmax(0, 1fr) 340px; gap:20px; align-items:start; }
  .stage { position:sticky; top:12px; display:flex; flex-direction:column; gap:12px; }
  .contexts { display:flex; gap:4px; }
  .seg { display:inline-flex; background:var(--sunk); border-radius:9px; padding:3px; gap:2px; flex-wrap:wrap; }
  .seg button { border:0; background:none; padding:5px 10px; border-radius:7px; cursor:pointer; white-space:nowrap; }
  .seg button[aria-pressed="true"] { background:var(--panel); box-shadow:0 1px 2px #0002; font-weight:600; }
  .viewport { background:var(--sunk); border-radius:var(--radius); padding:22px; display:grid; place-items:center; min-height:300px; }

  .cover { position:relative; overflow:hidden; width:100%; container-type:inline-size; border-radius:8px; background:#8883; }
  .cover > .art { position:absolute; inset:0; line-height:0; }
  .cover .area { position:absolute; display:flex; flex-direction:column; pointer-events:none; }
  .cover .title { font-weight:650; letter-spacing:-.02em; line-height:1.08; text-wrap:balance; margin:0; }
  .cover .title small { display:block; font-size:.42em; font-weight:500; letter-spacing:0; opacity:.75; margin-bottom:.5em; }
  .cover .logo { display:flex; align-items:center; gap:.45em; font-weight:700; letter-spacing:-.01em; }
  .cover .logo i { width:1.25em; height:1.25em; border-radius:.35em; background:currentColor; display:block; }
  .cover .card { background:#fff; color:#17171a; border-radius:2.2cqw; padding:2.6cqw 3cqw; box-shadow:0 1.5cqw 5cqw #0004; font:500 1.7cqw/1.6 ui-monospace, SFMono-Regular, Menlo, monospace; width:100%; height:100%; overflow:hidden; }
  .cover .card b { color:#7c3aed; font-weight:600; }

  /* Contexts the cover sits in. */
  .ctx-alone { width:100%; }
  .ctx-card { width:min(100%, 420px); background:var(--panel); border:1px solid var(--line); border-radius:16px; overflow:hidden; }
  .ctx-card .cover { border-radius:0; }
  .ctx-card .body { padding:14px 16px 18px; }
  .ctx-card .body small { color:var(--muted); }
  .ctx-card .body h3 { margin:4px 0 6px; font-size:18px; letter-spacing:-.01em; line-height:1.25; }
  .ctx-card .body p { margin:0; color:var(--muted); font-size:13px; }
  .ctx-link { width:min(100%, 520px); background:var(--panel); border:1px solid var(--line); border-radius:14px; overflow:hidden; }
  .ctx-link .cover { border-radius:0; }
  .ctx-link .body { padding:10px 14px 12px; border-top:1px solid var(--line); }
  .ctx-link .body small { color:var(--muted); font-size:12px; }
  .ctx-link .body b { display:block; margin:2px 0; }
  .ctx-link .body span { color:var(--muted); font-size:13px; }
  .ctx-hero { width:100%; background:var(--panel); border:1px solid var(--line); border-radius:14px; overflow:hidden; }
  .ctx-hero nav { display:flex; gap:14px; align-items:center; padding:10px 16px; font-size:13px; color:var(--muted); border-bottom:1px solid var(--line); }
  .ctx-hero nav b { color:var(--fg); margin-right:auto; }
  .ctx-hero .cover { border-radius:0; }

  .seeds { display:grid; grid-template-columns:repeat(auto-fill, minmax(118px, 1fr)); gap:8px; }
  .seeds button { padding:0; border:1px solid var(--line); border-radius:8px; overflow:hidden; cursor:pointer; background:var(--sunk); position:relative; aspect-ratio:16/9; }
  .seeds button > svg { position:absolute; inset:0; width:100%; height:100%; }
  .seeds button[aria-pressed="true"] { outline:2px solid var(--accent); outline-offset:1px; }
  .seeds button span { position:absolute; left:4px; right:4px; bottom:4px; font-size:10px; background:#000a; color:#fff; padding:1px 5px; border-radius:4px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; text-align:left; width:fit-content; max-width:calc(100% - 8px); }

  .alt { font-size:13px; color:var(--muted); }
  .alt b { color:var(--fg); font-weight:600; }
  .problems { display:flex; flex-direction:column; gap:6px; }
  .problems div { padding:8px 10px; border-radius:8px; font-size:13px; }
  .problems .error { background:var(--bad-bg); color:var(--bad); }
  .problems .warning { background:var(--warn-bg); color:var(--warn); }

  .panel { background:var(--panel); border:1px solid var(--line); border-radius:var(--radius); padding:16px; display:flex; flex-direction:column; gap:16px; }
  .field { display:flex; flex-direction:column; gap:6px; }
  .field > label, .field > .label { font-size:12px; color:var(--muted); font-weight:600; }
  .row { display:flex; gap:8px; align-items:center; }
  .row > * { min-width:0; }
  input[type=text], select { width:100%; padding:7px 9px; border:1px solid var(--line); border-radius:8px; background:var(--panel); }
  input[type=color] { width:40px; height:34px; padding:2px; border:1px solid var(--line); border-radius:8px; background:var(--panel); flex:none; }
  .icon { flex:none; border:1px solid var(--line); background:var(--panel); border-radius:8px; padding:6px 10px; cursor:pointer; }
  .icon:hover { border-color:var(--muted); }

  .areas { display:flex; flex-direction:column; gap:10px; }
  .areaRow { display:grid; grid-template-columns:auto 1fr auto; gap:10px; align-items:start; padding:10px; border:1px solid var(--line); border-radius:10px; }
  .grid9 { display:grid; grid-template-columns:repeat(3, 18px); gap:3px; }
  .grid9 button { width:18px; height:14px; border-radius:3px; border:1px solid var(--line); background:var(--sunk); padding:0; cursor:pointer; }
  .grid9 button[aria-pressed="true"] { background:var(--accent); border-color:var(--accent); }
  .areaRow .opts { display:flex; flex-direction:column; gap:6px; }
  .presets { display:flex; flex-wrap:wrap; gap:6px; }
  .chip { border:1px solid var(--line); background:var(--panel); border-radius:999px; padding:4px 10px; font-size:12px; cursor:pointer; }
  .chip:hover { border-color:var(--muted); }

  /* 3. Use */
  .use { display:grid; grid-template-columns:minmax(0, 1fr) 280px; gap:20px; align-items:start; margin-bottom:60px; }
  .code { background:var(--panel); border:1px solid var(--line); border-radius:var(--radius); overflow:hidden; }
  .code .bar { display:flex; align-items:center; gap:8px; padding:8px; border-bottom:1px solid var(--line); flex-wrap:wrap; }
  .code .bar .seg { flex:1; }
  .code pre { margin:0; padding:16px; overflow:auto; font:12.5px/1.6 ui-monospace, SFMono-Regular, Menlo, monospace; max-height:420px; white-space:pre; }
  .code .note { padding:0 16px 14px; color:var(--muted); font-size:12px; }
  .exports { display:flex; flex-direction:column; gap:8px; }
  .exports button { text-align:left; border:1px solid var(--line); background:var(--panel); border-radius:10px; padding:10px 12px; cursor:pointer; }
  .exports button:hover { border-color:var(--muted); }
  .exports button:disabled { opacity:.5; cursor:not-allowed; }
  .exports small { display:block; color:var(--muted); }
  body[data-mode="avatar"] .cover-only, body[data-mode="cover"] .avatar-only { display:none !important; }
  .style .thumb.round { display:grid; place-items:center; }
  .style .thumb.round > div { width:62%; aspect-ratio:1; border-radius:50%; overflow:hidden; position:relative; }
  .style .thumb.round > div > svg { position:absolute; inset:0; width:100%; height:100%; }
  .people { display:grid; grid-template-columns:auto 1fr; gap:28px; align-items:center; width:100%; }
  .people .big { width:clamp(96px, 22vw, 168px); aspect-ratio:1; position:relative; }
  .people .big > div, .person .mark { position:absolute; inset:0; overflow:hidden; line-height:0; }
  .people ul { list-style:none; margin:0; padding:0; display:flex; flex-direction:column; gap:12px; background:var(--panel); border:1px solid var(--line); border-radius:14px; padding:14px 16px; }
  .person { display:flex; align-items:center; gap:12px; }
  .person .slot { position:relative; flex:none; }
  .person b { display:block; font-size:14px; }
  .person small { color:var(--muted); }
  .seeds.avatars button { aspect-ratio:1; border-radius:18%; }
  .seeds.avatars.round button { border-radius:50%; }
  @media (max-width: 520px) { .people { grid-template-columns:1fr; justify-items:center; } .people ul { width:100%; } }
  .toast { position:fixed; bottom:20px; left:50%; transform:translateX(-50%); background:var(--accent); color:var(--on-accent); padding:8px 14px; border-radius:999px; font-size:13px; opacity:0; transition:opacity .2s; pointer-events:none; }
  .toast.show { opacity:1; }

  @media (max-width: 900px) {
    .tune, .use { grid-template-columns:1fr; }
    .stage { position:static; }
    .viewport { padding:12px; }
    header.top { flex-wrap:wrap; }
  }
  @media (max-width: 520px) {
    .wrap { padding:0 16px; }
    .styles { grid-template-columns:repeat(2, minmax(0, 1fr)); gap:8px; }
    .style .looks { display:none; }
  }
</style>
</head>
<body data-mode="cover">
<div class="wrap">
  <header class="top">
    <h1>Surfaces</h1>
    <div class="seg" id="mode" role="group" aria-label="Make"></div>
    <p>Pick a style, tune it, take the code.</p>
    <a href="/directions">Directions</a>
    <a href="/sheet" style="margin-left:0">Contact sheet</a>
  </header>

  <h2><b>1</b> · Pick a style</h2>
  <div class="styles" id="styles"></div>

  <h2><b>2</b> · Tune it</h2>
  <div class="tune">
    <div class="stage">
      <div class="row cover-only" style="justify-content:space-between; flex-wrap:wrap; gap:8px">
        <div class="seg" id="contexts" role="group" aria-label="Show the cover"></div>
        <button class="icon" id="replay" type="button" hidden>Play again</button>
      </div>
      <div class="viewport" id="viewport"></div>
      <div class="problems" id="problems" aria-live="polite"></div>
      <div class="alt" id="alt"></div>
      <div class="field">
        <div class="label" id="othersLabel" style="font-size:12px; color:var(--muted); font-weight:600">Other seeds, same settings</div>
        <div class="seeds" id="seeds"></div>
      </div>
    </div>

    <div class="panel">
      <div class="field">
        <label for="seed" id="seedLabel">Seed: the page's slug</label>
        <div class="row">
          <input type="text" id="seed" spellcheck="false" autocomplete="off">
          <button class="icon" id="dice" type="button" title="A new seed">Shuffle</button>
        </div>
      </div>
      <div class="field">
        <label for="hex">Brand colour</label>
        <div class="row">
          <input type="color" id="color" aria-label="Pick a colour">
          <input type="text" id="hex" spellcheck="false" autocomplete="off">
        </div>
      </div>
      <div class="field"><div class="label">Theme</div><div class="seg" id="theme" role="group" aria-label="Theme"></div></div>
      <div class="field cover-only"><div class="label">Size</div><div class="seg" id="size" role="group" aria-label="Size"></div></div>
      <div class="field avatar-only"><div class="label">Shown at</div><div class="seg" id="avatarSize" role="group" aria-label="Avatar size"></div></div>
      <div class="field avatar-only"><div class="label">Corners</div><div class="seg" id="corners" role="group" aria-label="Corners"></div></div>
      <div class="field cover-only">
        <div class="label">Content</div>
        <div class="presets" id="layouts"></div>
        <div class="areas" id="areas"></div>
        <div class="row">
          <button class="icon" id="addTitle" type="button">Add title</button>
          <button class="icon" id="addLogo" type="button">Add logo</button>
          <button class="icon" id="addCard" type="button">Add card</button>
        </div>
      </div>
      <div class="field cover-only"><label for="title">Title text</label><input type="text" id="title"></div>
      <div class="field"><div class="label">Mood</div><div class="seg" id="mood" role="group" aria-label="Mood"></div></div>
      <div class="field"><div class="label">Grain</div><div class="seg" id="grain" role="group" aria-label="Grain"></div></div>
      <div class="field cover-only" id="shapeField"><label for="shape">Shape</label><select id="shape"></select></div>
      <div class="field cover-only"><div class="label">Detail</div><div class="seg" id="detail" role="group" aria-label="Detail"></div></div>
      <div class="field cover-only"><div class="label">Motion</div><div class="seg" id="motion" role="group" aria-label="Motion"></div></div>
    </div>
  </div>

  <h2><b>3</b> · Use it</h2>
  <div class="use">
    <div class="code">
      <div class="bar">
        <div class="seg" id="tabs" role="tablist" aria-label="Code"></div>
        <button class="icon" id="copy" type="button">Copy</button>
      </div>
      <pre id="code"></pre>
      <div class="note" id="note"></div>
    </div>
    <div class="exports">
      <button type="button" id="link">Copy link<small>This page, set up as it is now</small></button>
      <button type="button" id="svg">Download SVG<small>Still, any size, both themes with auto</small></button>
      <button type="button" id="png">Download PNG<small>At the cover's own size</small></button>
    </div>
  </div>
</div>
<div class="toast" id="toast" role="status"></div>

<script type="module">
import { generate, validate, describe, toSvg, toHtml, catalog, formats, PLACES, MOODS, GRAINS, DETAILS, MOTIONS, avatar, validateAvatar, AVATAR_STYLES } from "/dist/index.js"
import { watch } from "/dist/dom.js"
import { toPngInBrowser } from "/dist/png.js"

const $ = (selector) => document.querySelector(selector)
const SIZES = [
  { key: "blog", label: "16:9", width: 1600, height: 900 },
  { key: "og", label: "OG", width: formats.og.width, height: formats.og.height },
  { key: "square", label: "Square", width: 1200, height: 1200 },
  { key: "wide", label: "Wide", width: 2400, height: 1200 },
  { key: "strip", label: "Strip", width: 1800, height: 600 },
  { key: "portrait", label: "4:5", width: 1080, height: 1350 },
  { key: "story", label: "Story", width: 1080, height: 1920 },
]
const CONTEXTS = [
  { key: "alone", label: "Cover" },
  { key: "card", label: "In a card" },
  { key: "link", label: "Link preview" },
  { key: "hero", label: "Hero" },
]
const LAYOUTS = {
  "Title, bottom left": [{ kind: "title", place: "bottom-left", size: "lg" }],
  "Title, centred": [{ kind: "title", place: "center", size: "lg" }],
  "Logo and title": [{ kind: "logo", place: "top-left", size: "sm" }, { kind: "title", place: "bottom-left", size: "lg" }],
  "A card": [{ kind: "card", place: "center", size: "md", art: "behind" }],
  "Art only": [],
}
const WORDS = [
  ["quiet", "bright", "slow", "open", "early", "small", "deep", "clear", "warm", "plain", "lucky", "steady"],
  ["harbor", "field", "lantern", "orchard", "signal", "meadow", "atlas", "river", "garden", "summit", "letter", "beacon"],
]
const randomSeed = () => `${WORDS[0][Math.floor(Math.random() * 12)]}-${WORDS[1][Math.floor(Math.random() * 12)]}-${Math.floor(Math.random() * 90 + 10)}`

// Everything the page shows comes from this, and the link carries it.
const state = {
  style: "aquatint", seed: "how-the-new-search-works", color: "#635bff", theme: "light", size: "blog",
  mood: "", grain: "natural", detail: "none", motion: "none", shape: "",
  areas: LAYOUTS["Title, bottom left"].map((area) => ({ ...area })),
  title: "How the new search works", context: "alone", tab: "react",
  // Avatars keep their own style and seed, so switching back and forth loses
  // neither.
  mode: "cover", avatarStyle: "riso", person: "ada", avatarSize: "40", corners: "round",
}
// The people in the sample list, by handle.
const PEOPLE = [["ada", "Ada Lovelace"], ["grace", "Grace Hopper"], ["linus", "Linus Torvalds"], ["margaret", "Margaret Hamilton"], ["alan", "Alan Turing"], ["barbara", "Barbara Liskov"], ["dennis", "Dennis Ritchie"], ["katherine", "Katherine Johnson"]]
const nameOf = (handle) => PEOPLE.find(([h]) => h === handle)?.[1] ?? handle
const avatarMode = () => state.mode === "avatar"
let others = Array.from({ length: 8 }, randomSeed)

// The link holds the state, so a setup can be shared.
const LINKED = ["mode", "style", "seed", "color", "theme", "size", "mood", "grain", "detail", "motion", "shape", "title", "context", "tab", "avatarStyle", "person", "avatarSize", "corners"]
function readLink() {
  const query = new URLSearchParams(location.hash.slice(1))
  for (const key of LINKED) {
    if (query.has(key)) state[key] = query.get(key)
  }
  if (query.has("areas")) {
    state.areas = query.get("areas").split(",").filter(Boolean).map((part) => {
      const [kind, place, size, art] = part.split(":")
      return { kind, place, size, ...(art ? { art } : null) }
    })
  }
}
function writeLink() {
  const query = new URLSearchParams()
  for (const key of LINKED) {
    if (state[key]) query.set(key, state[key])
  }
  query.set("areas", state.areas.map((area) => [area.kind, area.place, area.size, area.art].filter(Boolean).join(":")).join(","))
  history.replaceState(null, "", `#${query}`)
}

const entry = () => catalog.find((item) => item.style === state.style)
const size = () => SIZES.find((item) => item.key === state.size) ?? SIZES[0]

// The library's input, exactly as a caller would write it.
function input({ seed = state.seed, still = false } = {}) {
  const { width, height } = size()
  const value = { style: state.style, seed, color: state.color }
  if (width !== 1600 || height !== 900) Object.assign(value, { width, height })
  if (state.areas.length) value.areas = state.areas.map(({ place, size, art }) => ({ place, size, ...(art === "behind" ? { art } : null) }))
  if (state.theme !== "light") value.theme = state.theme
  if (state.mood) value.mood = state.mood
  if (state.grain !== "natural") value.grain = state.grain
  if (state.detail !== "none") value.detail = state.detail
  if (state.motion !== "none" && !still) value.motion = state.motion
  if (state.shape && entry()?.shapes.includes(state.shape)) value.shape = state.shape
  return value
}

// An avatar's input, exactly as a caller would write it.
function avatarInput({ seed = state.person, size = Number(state.avatarSize) } = {}) {
  const value = { style: state.avatarStyle, seed, color: state.color, size }
  if (state.theme !== "light") value.theme = state.theme
  if (state.mood) value.mood = state.mood
  if (state.grain !== "natural") value.grain = state.grain
  if (state.corners === "square") value.square = true
  return value
}

const quietly = (make) => {
  // Seeds like "test" warn once on the console; the page shows warnings itself.
  const warn = console.warn
  console.warn = () => {}
  try { return make() } finally { console.warn = warn }
}

// ---- Controls -------------------------------------------------------------
function segmented(element, options, key, onChange) {
  element.replaceChildren(...options.map(({ value, label }) => {
    const button = document.createElement("button")
    button.type = "button"
    button.textContent = label
    button.setAttribute("aria-pressed", String(state[key] === value))
    button.addEventListener("click", () => { state[key] = value; onChange?.(); update() })
    return button
  }))
}
const words = (list) => list.map((value) => ({ value, label: value }))

function drawControls() {
  document.body.dataset.mode = state.mode
  segmented($("#mode"), [{ value: "cover", label: "Covers" }, { value: "avatar", label: "Avatars" }], "mode", () => {
    if (!tabs().some((tab) => tab.key === state.tab)) state.tab = "react"
  })
  $("#seed").value = avatarMode() ? state.person : state.seed
  $("#seedLabel").textContent = avatarMode() ? "Seed: the person's id or handle" : "Seed: the page's slug"
  $("#othersLabel").textContent = avatarMode() ? "Other people, same settings" : "Other seeds, same settings"
  segmented($("#avatarSize"), ["24", "32", "40", "64", "96"].map((value) => ({ value, label: `${value} px` })), "avatarSize")
  segmented($("#corners"), [{ value: "round", label: "round" }, { value: "square", label: "square" }], "corners")

// Content placed in its area, aligned to the side it hangs from, coloured
// with the area's ink when it sits on the art, as the React component does.
function placeContent(cover, scene) {
  scene.areas.forEach((area, index) => {
    const asked = state.areas[index]
    if (!asked) return
    const box = document.createElement("div")
    box.className = "area"
    const share = (value, of) => `${(value / of) * 100}%`
    Object.assign(box.style, {
      left: share(area.x, scene.output.w), top: share(area.y, scene.output.h),
      width: share(area.width, scene.output.w), height: share(area.height, scene.output.h),
      justifyContent: area.place?.startsWith("top") ? "flex-start" : area.place?.startsWith("bottom") ? "flex-end" : "center",
      alignItems: area.place?.endsWith("left") ? "flex-start" : area.place?.endsWith("right") ? "flex-end" : "center",
      textAlign: area.place?.endsWith("left") ? "left" : area.place?.endsWith("right") ? "right" : "center",
      ...(area.art === "around" ? { color: area.ink } : null),
    })
    // Text sized by the cover's width and the area's size.
    const scale = { sm: 0.42, md: 0.75, lg: 1 }[asked.size] ?? 1
    const tall = scene.output.h / scene.output.w
    const base = Math.min(5.4, 5.4 * Math.max(0.55, Math.min(1.25, tall * 1.78)))
    if (asked.kind === "title") {
      const title = document.createElement("h3")
      title.className = "title"
      title.style.fontSize = `${base * scale}cqw`
      const date = document.createElement("small")
      date.textContent = "Oct 31, 2026"
      title.append(date, document.createTextNode(state.title))
      box.append(title)
    } else if (asked.kind === "logo") {
      const logo = document.createElement("div")
      logo.className = "logo"
      logo.style.fontSize = `${base * 0.8 * Math.max(scale, 0.5)}cqw`
      logo.innerHTML = "<i></i><span>Acme</span>"
      box.append(logo)
    } else {
      const card = document.createElement("div")
      card.className = "card"
      card.innerHTML = `<b>const</b> cover = generate({<br>&nbsp;&nbsp;style: "${state.style}",<br>&nbsp;&nbsp;seed: post.slug,<br>})`
      box.append(card)
    }
    cover.append(box)
  })
}

let stopWatch = null
// An avatar as people meet it: large on its own, and small beside names in

function drawAvatarPreview() {
  const problems = validateAvatar(avatarInput())
  $("#problems").replaceChildren(...problems.errors.map((text) => Object.assign(document.createElement("div"), { className: "error", textContent: text })))
  stopWatch?.()
  stopWatch = null
  $("#replay").hidden = true
  if (problems.errors.length) return null
  const size = Number(state.avatarSize)
  const radius = state.corners === "square" ? "18%" : "50%"
  const mark = (seed, px) => {
    const slot = document.createElement("div")
    slot.className = "slot"
    Object.assign(slot.style, { width: `${px}px`, height: `${px}px` })
    const art = document.createElement("div")
    art.className = "mark"
    art.style.borderRadius = radius
    art.innerHTML = toHtml(avatar(avatarInput({ seed, size: px })), { fill: true })
    slot.append(art)
    return slot
  }
  const big = document.createElement("div")
  big.className = "big"
  const inner = document.createElement("div")

  inner.innerHTML = toHtml(avatar(avatarInput({ size: 256 })), { fill: true })
  big.append(inner)
  const list = document.createElement("ul")

function drawPreview(replay = false) {
  if (avatarMode()) return drawAvatarPreview()
  const problems = validate(input())
  $("#problems").replaceChildren(
    ...problems.errors.map((text) => Object.assign(document.createElement("div"), { className: "error", textContent: text })),
    ...problems.warnings.map((text) => Object.assign(document.createElement("div"), { className: "warning", textContent: text }))
  )
  if (problems.errors.length) return null
  const scene = quietly(() => generate(input()))
  stopWatch?.()
  const cover = document.createElement("div")
  cover.className = "cover"
  cover.style.aspectRatio = `${scene.output.w} / ${scene.output.h}`
  const art = document.createElement("div")
  art.className = "art"
  art.setAttribute("aria-hidden", "true")
  art.innerHTML = toHtml(scene, { fill: true })
  cover.append(art)
  placeContent(cover, scene)
  const frame = document.createElement("div")
  frame.className = `ctx-${state.context}`
  const tall = scene.output.h > scene.output.w * 1.05
  if (tall && state.context === "alone") frame.style.width = `min(100%, ${Math.round(420 * scene.output.w / scene.output.h * 1.4)}px)`
  if (state.context === "card") {
    frame.append(cover)
    frame.insertAdjacentHTML("beforeend", `<div class="body"><small>Oct 31, 2026 · 6 min read</small><h3></h3><p>What changed, why it is faster, and what it means for your workspace.</p></div>`)
    frame.querySelector("h3").textContent = state.title
  } else if (state.context === "link") {
    frame.append(cover)
    frame.insertAdjacentHTML("beforeend", `<div class="body"><small>example.com</small><b></b><span>What changed, why it is faster, and what it means for you.</span></div>`)
    frame.querySelector("b").textContent = state.title
  } else if (state.context === "hero") {
    frame.insertAdjacentHTML("beforeend", `<nav><b>Acme</b><span>Product</span><span>Pricing</span><span>Blog</span></nav>`)
    frame.append(cover)

  $("#viewport").replaceChildren(frame)
  stopWatch = state.motion === "none" ? null : watch(art)
  $("#replay").hidden = state.motion === "none"
  $("#alt").innerHTML = `<b>Alt text</b>, when the cover stands alone: ${escapeHtml(describe(scene, { title: state.title }))}`
  return scene
}

const TABS = [
  { key: "react", label: "React" },
  { key: "input", label: "Input" },

// As a person would write it: small objects on one line, lists one item a
// line, keys unquoted.
function json(value, indent = "") {
  const inner = `${indent}  `
  if (Array.isArray(value)) return `[\n${value.map((item) => `${inner}${json(item, inner)},`).join("\n")}\n${indent}]`
  if (value && typeof value === "object") {
    const entries = Object.entries(value)
    const flat = entries.every(([, v]) => typeof v !== "object")
    const pairs = entries.map(([k, v]) => `${k}: ${json(v, inner)}`)
    return flat && pairs.join(", ").length < 60 && indent ? `{ ${pairs.join(", ")} }` : `{\n${pairs.map((pair) => `${inner}${pair},`).join("\n")}\n${indent}}`
  }
  return JSON.stringify(value)
}
const contentFor = (kind) => (kind === "title" ? "<h1>{post.title}</h1>" : kind === "logo" ? "<Logo />" : "<Card />")

const AVATAR_TABS = [
  { key: "react", label: "React" },

  { key: "og", label: "PNG" },

]

function avatarCode() {
  const value = avatarInput()
  const shown = { ...value, seed: "user.id" }
  const literal = (text) => text.replace('"user.id"', "user.id")
  const props = Object.entries(shown).map(([key, v]) =>
    key === "seed" ? "seed={user.id}" : typeof v === "string" ? `${key}="${v}"` : v === true ? key : `${key}={${v}}`)
  switch (state.tab) {
    case "input":
      return { text: literal(json(shown)), note: "An avatar's whole input. validateAvatar(input) checks it without drawing." }
    case "url": {
      const query = new URLSearchParams({ style: value.style, seed: "user-42", color: value.color.replace("#", ""), size: String(value.size) })
      for (const key of ["theme", "mood", "grain"]) if (value[key]) query.set(key, value[key])
      if (value.square) query.set("square", "1")
      return { text: `<img src="/avatar?${query}" alt="" width="${value.size}" height="${value.size}">\n\n// The route:\nimport { createAvatarHandler } from "@pogrobert/surfaces/http"\nexport const GET = createAvatarHandler()`, note: "The same id always draws the same avatar, so it caches for good." }
    }
    case "og":
      return { text: `import { avatar } from "@pogrobert/surfaces"\nimport { toPng } from "@pogrobert/surfaces/png"\n\nconst png = await toPng(avatar(${literal(json({ ...shown, size: 512 }))}))`, note: "A picture has one theme: use light or dark, not auto." }
    case "agent":
      return {
        text: `Give every user an avatar with @pogrobert/surfaces (read AGENTS.md in the package first).\n\nUse exactly this, with the user's id as the seed:\n\n${literal(json(shown))}\n\n- In React: <Avatar ${props.join(" ")} />\n- Beside the user's name it needs no label; standing alone, label={user.name}.\n- Don't add options; validateAvatar(input) explains any error.`,
        note: "Paste into your coding agent.",
      }
    default:
      return { text: `import { Avatar } from "@pogrobert/surfaces/react"\n\n<Avatar ${props.join(" ")} />`, note: "Round unless square. Beside a name it is hidden from screen readers; alone, give it label={user.name}." }
  }
}

function code() {
  if (avatarMode()) return avatarCode()
  const value = input()
  delete value.image
  const shown = { ...value, seed: "post.slug" }
  const literal = (text) => text.replace('"post.slug"', "post.slug")
  const onlyTitle = state.areas.length === 1 && state.areas[0].kind === "title" && state.areas[0].place === "bottom-left" && state.areas[0].size === "lg"
  const props = Object.entries(shown).filter(([key]) => key !== "areas").map(([key, v]) =>
    key === "seed" ? `seed={post.slug}` : typeof v === "number" ? `${key}={${v}}` : `${key}="${v}"`)
  switch (state.tab) {
    case "input":
      return { text: literal(json(shown)), note: "The whole input. Every value comes from a fixed list; validate(input) checks it without drawing." }
    case "react": {
      const head = `import { Surface } from "@pogrobert/surfaces/react"\n\n`
      if (onlyTitle) return { text: `${head}<Surface\n  ${props.join("\n  ")}\n>\n  <h1>{post.title}</h1>\n</Surface>`, note: "Children are one large title at the bottom left." }
      const areas = state.areas.map((area) => `    { place: "${area.place}", size: "${area.size}"${area.art === "behind" ? `, art: "behind"` : ""}, content: ${contentFor(area.kind)} },`).join("\n")
      return { text: `${head}<Surface\n  ${props.join("\n  ")}\n  areas={[\n${areas}\n  ]}\n/>`, note: "Each area takes its content, placed and coloured to read on the art." }
    }
    case "dom":
      return { text: `import { mount } from "@pogrobert/surfaces/dom"\n\nmount(document.querySelector("#cover"), ${literal(json(shown))}, { label: true })`, note: "Draws the cover inside the element; place your content over it at scene.areas." }
    case "url": {
      const query = new URLSearchParams()
      query.set("style", value.style)
      query.set("seed", "your-post-slug")
      query.set("color", value.color.replace("#", ""))
      for (const key of ["width", "height", "theme", "mood", "grain", "detail", "shape"]) if (value[key] !== undefined) query.set(key, value[key])
      const areas = (value.areas ?? []).map((area) => `area=${area.place}:${area.size}${area.art ? `:${area.art}` : ""}`).join("&")
      return { text: `/cover?${query}${areas ? `&${areas}` : ""}\n\n// The route:\nimport { createHandler } from "@pogrobert/surfaces/http"\nexport const GET = createHandler()`, note: "A URL always draws the same bytes, so the cover caches for good. Add format=png for a PNG." }
    }
    case "og": {
      const og = { ...shown }
      delete og.width
      delete og.height
      delete og.motion
      if (og.theme === "auto") og.theme = "light"
      const body = literal(json(og)).replace(/\n}$/, "\n  ...formats.og,\n}")
      return {
        text: `import { generate, describe, formats } from "@pogrobert/surfaces"\nimport { toPng } from "@pogrobert/surfaces/png"\n\nconst scene = generate(${body})\nconst png = await toPng(scene)\nconst alt = describe(scene, { title: post.title })`,
        note: "1200×630, one theme. Draw the title over the PNG at scene.areas, in scene.areas[i].ink.",
      }
    }
    case "agent":
      return {
        text: `Add cover art to every blog post with @pogrobert/surfaces (read AGENTS.md in the package first).\n\nUse exactly this input, with the post's slug as the seed:\n\n${literal(json(shown))}\n\n- Don't add options or change the values; validate(input) explains any error.\n- In React, use <Surface> ${onlyTitle ? "with the title as its children" : "with each area's content"}.\n- Covers under the post's own heading need no alt text; for the OG image use describe(scene, { title }).`,
        note: "Paste into your coding agent.",
      }
  }
}

  const element = $("#toast")
  element.textContent = text
  element.classList.add("show")
  clearTimeout(toastTimer)
  toastTimer = setTimeout(() => element.classList.remove("show"), 1400)
}

// Typing updates the drawing after a short pause, so a cover isn't drawn for
// every key.
function update({ keepControls = false } = {}) {
  if (!keepControls) drawControls()
  clearTimeout(timer)
  timer = setTimeout(() => {
    drawPreview()
    drawStyles()
    drawSeeds()
    drawCode()
    $("#png").disabled = state.theme === "auto"
    $("#png").querySelector("small").textContent = state.theme === "auto" ? "Pick light or dark: a PNG has one theme" : avatarMode() ? "512 pixels across" : "At the cover's own size"
    writeLink()
  }, keepControls ? 140 : 0)
}

readLink()
update()
// A link opened on this page changes only the part after the #, which does
// not reload it.
addEventListener("hashchange", () => { readLink(); update() })
</script>
</body>
</html>
